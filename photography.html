  <style>
    .photo-gallery {
      margin-top: 3rem;
    }

    .photo-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .photo-gallery-grid figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .photo-gallery-grid img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(1,5,16,.45);
    }

    .photo-gallery-grid figcaption {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-2);
    }
  </style>
</head>
